<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>User panel</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="user-panel">
    <div class="user-panel__left">
      <img class="user-panel__avatar"
           src="./img/avatar.png"
           srcset="./img/avatar.png 1x, ./img/avatar@2x.png 2x"
           height="72"
           width="72"
           alt="User avatar">
      <div class="user-info">
        <p class="user-name">Илья Морозов</p>
        <small class="user-job-title">Motion Designer</small>
      </div>
    </div>
    <div class="user-panel__right">
      <span class="user-status online">В сети</span>
      <button class="user-button_open-profile">Открыть профиль</button>
    </div>
  </div>
</body>
</html>
